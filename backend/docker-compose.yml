version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: propreel-postgres
    restart: always
    environment:
      POSTGRES_DB: propreel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/database/migrations/002_seed_pune_market.sql:/docker-entrypoint-initdb.d/02_seeds.sql
      - ./src/database/migrations/003_notifications_schema.sql:/docker-entrypoint-initdb.d/03_notifications.sql
      - ./src/database/migrations/004_monetization_verification_schema.sql:/docker-entrypoint-initdb.d/04_monetization.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propreel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propreel-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: propreel-api
    restart: always
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/propreel
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_jwt_access_secret_key_change_in_production
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_change_in_production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
